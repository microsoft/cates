name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    env:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    steps:
      - name: Run release-please
        if: env.RELEASE_PLEASE_TOKEN != ''
        uses: googleapis/release-please-action@v5
        with:
          # Uses release-please-config.json and .release-please-manifest.json
          # at the repository root.
          token: ${{ env.RELEASE_PLEASE_TOKEN }}

      - name: Report disabled release automation
        if: env.RELEASE_PLEASE_TOKEN == ''
        run: echo "::notice::Set RELEASE_PLEASE_TOKEN to enable release PR automation under the repository branch ruleset."
