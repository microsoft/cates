name: npm-publish

# Fires when release-please creates a tag (e.g. `cates-analyzer-v1.2.0`) or
# any `v*` tag manually pushed. Prefer npm trusted publishing (OIDC); the
# `NPM_TOKEN` secret remains an optional bootstrap fallback for the first
# publish. Provenance makes the resulting tarball signed and verifiable.
on:
  push:
    tags:
      - 'v*'
      - 'cates-analyzer-v*'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write   # required for npm provenance (Sigstore)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - run: npm run typecheck:all

      - run: npm test

      - run: npm run build

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > cates-analyzer-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: cates-analyzer-sbom.cdx.json
          retention-days: 90

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          # npm uses OIDC first when a trusted publisher is configured, then
          # falls back to this token for initial package bootstrapping.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
